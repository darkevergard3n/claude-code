# Apache configuration for VEXOIT website
# Ubuntu/Debian: Place in /etc/apache2/sites-available/vexoit.conf
# CentOS/RHEL: Place in /etc/httpd/conf.d/vexoit.conf
#
# After placing, run:
# Ubuntu/Debian: sudo a2ensite vexoit.conf && sudo systemctl reload apache2
# CentOS/RHEL: sudo systemctl reload httpd

# HTTP Virtual Host - Redirect to HTTPS
<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    # Redirect all HTTP to HTTPS
    Redirect permanent / https://your-domain.com/
</VirtualHost>

# HTTPS Virtual Host - Main Configuration
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/vexoit

    # SSL Configuration (Let's Encrypt)
    # These will be added automatically when you run:
    # sudo certbot --apache -d your-domain.com -d www.your-domain.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/your-domain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-domain.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Directory Configuration
    <Directory /var/www/vexoit>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted

        # Rewrite rules for clean URLs
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Remove .html extension
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^(.+)$ $1.html [L]

            # Redirect www to non-www (optional)
            # RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
            # RewriteRule ^(.*)$ https://%1/$1 [R=301,L]
        </IfModule>
    </Directory>

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/xml application/xml+rss
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # Browser Caching
    <IfModule mod_expires.c>
        ExpiresActive On

        # Images - 1 year
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/avif "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"

        # CSS and JavaScript - 1 year
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/javascript "access plus 1 year"

        # Fonts - 1 year
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType font/ttf "access plus 1 year"
        ExpiresByType font/otf "access plus 1 year"
        ExpiresByType application/font-woff "access plus 1 year"

        # HTML - no cache
        ExpiresByType text/html "access plus 0 seconds"
    </IfModule>

    # Add immutable header for static assets
    <IfModule mod_headers.c>
        <FilesMatch "\.(jpg|jpeg|png|gif|svg|webp|avif|ico|css|js|woff|woff2|ttf|otf)$">
            Header set Cache-Control "max-age=31536000, public, immutable"
        </FilesMatch>

        <FilesMatch "\.(html)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </FilesMatch>
    </IfModule>

    # Deny access to hidden files
    <DirectoryMatch "^\.|\/\.">
        Require all denied
    </DirectoryMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/vexoit-error.log
    CustomLog ${APACHE_LOG_DIR}/vexoit-access.log combined
</VirtualHost>
</IfModule>

# Required Apache modules (enable with a2enmod on Ubuntu/Debian):
# - mod_ssl
# - mod_rewrite
# - mod_headers
# - mod_expires
# - mod_deflate
#
# Commands:
# sudo a2enmod ssl rewrite headers expires deflate
# sudo systemctl restart apache2
